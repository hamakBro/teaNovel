<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إعادة التوجيه...</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }
        .button {
            display: inline-block;
            padding: 10px 20px;
            font-size: 16px;
            color: white;
            background-color: #007bff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
        }
        .button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <h1>إعادة التوجيه...</h1>
    <p id="message">إذا لم يتم إعادة توجيهك تلقائيًا، فانقر فوق الزر أدناه لفتح التطبيق.</p>
    <a id="open-app-button" class="button" href="#">فتح التطبيق</a>

    <script>
        function getQueryParams() {
            const urlParams = new URLSearchParams(window.location.search);
            const secret = urlParams.get('secret');  // Appwrite reset token
            const userId = urlParams.get('userId');  // Appwrite user ID
            return { secret, userId };
        }

        function redirectToApp() {
            const params = getQueryParams();
            const customUri = `teaNovel://resetPassword?secret=${params.secret}&userId=${params.userId}`;

            if (params.secret && params.userId) {
                // Update button link
                const button = document.getElementById('open-app-button');
                button.href = customUri;
                button.style.display = 'inline-block';
                button.textContent = 'فتح التطبيق';

                // Attempt automatic redirect
                window.location.href = customUri;

                // Fallback: Show button if redirect fails
                setTimeout(() => {
                    if (!document.hidden) {
                        button.style.display = 'inline-block';
                        document.getElementById('message').textContent = 'إذا لم يفتح التطبيق، انقر على الزر أدناه.';
                    }
                }, 2000);
            } else {
                document.getElementById('message').textContent = 'رابط إعادة التعيين غير صالح.';
            }
        }

        // Call the redirect function on page load
        redirectToApp();
    </script>
</body>
</html>
